name: HTTP fragment regression evidence
on:
  push:
    branches: ['ci/http-fragment-6918']
    paths: ['.github/workflows/http-fragment-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 6e90d006fcfabaef245287b8f4748d7f2bf92755
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify fixed HttpRequest tests with Maven
        shell: bash
        run: |
          mkdir -p evidence
          ./mvnw -B -ntp -pl langchain4j-http-client -am test -Dtest=HttpRequestTest -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee evidence/maven-after.log
          cp langchain4j-http-client/target/surefire-reports/TEST-dev.langchain4j.http.client.HttpRequestTest.xml evidence/after.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('evidence/after.xml').getroot()
          assert int(root.attrib['tests']) >= 55
          assert all(int(root.attrib.get(k, '0')) == 0 for k in ('failures', 'errors', 'skipped'))
          print('FIXED_TESTS:', root.attrib['tests'], 'failures=0 errors=0 skipped=0')
          PY
      - name: Confirm four fragment regressions fail on original implementation
        shell: bash
        run: |
          trap 'git restore langchain4j-http-client/src/main/java/dev/langchain4j/http/client/HttpRequest.java' EXIT
          git restore --source=6f11264256108a7b1f23110b56e904bbbe93d744 langchain4j-http-client/src/main/java/dev/langchain4j/http/client/HttpRequest.java
          set +e
          ./mvnw -B -ntp -pl langchain4j-http-client -am test '-Dtest=HttpRequestTest#should_add_query_parameters_before_fragment' -Dsurefire.failIfNoSpecifiedTests=false > evidence/maven-before.log 2>&1
          result=$?
          set -e
          cat evidence/maven-before.log
          test "$result" -eq 1
          cp langchain4j-http-client/target/surefire-reports/TEST-dev.langchain4j.http.client.HttpRequestTest.xml evidence/before.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('evidence/before.xml').getroot()
          assert int(root.attrib['tests']) == 7
          assert int(root.attrib['failures']) == 4
          assert all(int(root.attrib.get(k, '0')) == 0 for k in ('errors', 'skipped'))
          cases = list(root.iter('testcase'))
          assert all(c.get('name', '').startswith('should_add_query_parameters_before_fragment') for c in cases)
          print('BASELINE_REGRESSION: 7 cases, 4 expected failures, 3 controls passed')
          PY
      - name: Check formatting against the PR base
        shell: bash
        run: |
          git update-ref refs/remotes/origin/main 6f11264256108a7b1f23110b56e904bbbe93d744
          ./mvnw -B -ntp -Pspotless -pl langchain4j-http-client -am spotless:check 2>&1 | tee evidence/spotless.log
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-fragment-java-${{ matrix.java }}
          path: evidence/
